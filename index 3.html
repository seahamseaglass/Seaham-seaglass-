<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seaham Seaglass Hunt</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#62c9ee}#g{max-width:520px;height:100%;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#62c9ee 0 43%,#dfc38d 44% 66%,#128bb5 67%)}#sea{position:absolute;bottom:0;width:100%;height:35%;background:linear-gradient(#24b9dd,#0878a3)}.wave{position:absolute;bottom:31%;width:120%;height:35px;background:#efffff;border-radius:50%;animation:w 2s infinite}@keyframes w{50%{transform:translateX(18px)}}#cliff{position:absolute;top:25%;width:100%;height:23%;background:#71836e}.hud{position:absolute;top:8px;left:8px;right:8px;z-index:5;display:flex;gap:6px;color:white}.box{background:#063d5aee;border-radius:13px;padding:7px}.stats{flex:1}.bar{height:10px;background:#183548;border-radius:9px}.fill{height:100%;background:#ffd43b;width:72%}.quest{position:absolute;top:68px;left:8px;background:#fff;color:#17394b;border-radius:12px;padding:8px;font-size:11px;z-index:5}.player{position:absolute;left:43%;top:55%;font-size:58px}.dog{position:absolute;left:25%;top:65%;font-size:42px}.glass{position:absolute;font-size:29px;z-index:8;cursor:pointer;animation:b 1.4s infinite}@keyframes b{50%{transform:translateY(-5px)}}.g1{left:18%;top:61%}.g2{left:70%;top:59%}.g3{left:47%;top:69%}.g4{left:82%;top:73%}.g5{left:28%;top:76%}.g6{left:8%;top:69%}.rare{right:27%;bottom:18%}.btn{position:absolute;border:0;color:white;background:#075d82;border-radius:50%;font-weight:bold}.search{right:0;bottom:55px;width:66px;height:66px}.waves{right:75px;bottom:5px;width:74px;height:74px}.bag{right:0;bottom:5px;width:66px;height:40px;border-radius:13px}.joy{position:absolute;left:10px;bottom:5px;width:90px;height:90px;border-radius:50%;background:#07354dbb;z-index:10}.stick{width:42px;height:42px;margin:24px;border-radius:50%;background:#d9edf2}.tutorial{position:absolute;inset:0;z-index:20;background:#061d2ddd;display:flex;align-items:end;padding:15px}.card{background:#f5ead1;color:#17394b;border-radius:20px;padding:18px;width:100%}.card button{width:100%;padding:13px;background:#087aa4;color:white;border:0;border-radius:13px;font-weight:bold}.toast{display:none;position:absolute;top:120px;left:6%;width:88%;z-index:30;background:white;color:#17394b;border-radius:14px;padding:10px;text-align:center;font-weight:bold}
</style></head><body><div id="g"><div id="cliff"></div><div id="sea"></div><div class="wave"></div>
<div class="hud"><div class="box">🌊</div><div class="box stats"><b>Old Sea Dog · Lv 3</b><div class="bar"><div id="fill" class="fill"></div></div>⚡ <span id="energy">72</span>/100</div><div class="box">🪙 <span id="coins">1250</span></div></div>
<div class="quest">👩 <b>Lisa's Hunt</b><br>Find 5 pieces: <span id="count">0</span>/5</div><div class="player">🧔‍♂️</div><div class="dog">🐕</div>
<div class="glass g1" data-v="10" data-n="Green">🟢</div><div class="glass g2" data-v="15" data-n="Brown">🟤</div><div class="glass g3" data-v="25" data-n="Blue">🔵</div><div class="glass g4" data-v="60" data-n="Orange">🟠</div><div class="glass g5" data-v="8" data-n="White">⚪</div><div class="glass g6" data-v="20" data-n="Green">🟢</div><div class="glass rare" data-v="120" data-n="Blood Red">🔴</div>
<div class="joy" id="joy"><div class="stick"></div></div><button class="btn search" id="search">🔎<br>SEARCH</button><button class="btn waves" id="waves">🌊<br>WAVES</button><button class="btn bag" id="bag">🎒 BAG</button><div id="toast" class="toast"></div>
<div class="tutorial" id="tutorial"><div class="card"><h2>Stage 1 — Pebble Beach 🌊</h2><p>Move Old Sea Dog, collect sea glass and manage your energy.</p><p>Tap pieces to collect them. Watch the waves!</p><button onclick="start()">START HUNT</button></div></div></div>
<script>
let s={e:72,c:1250,n:0,items:[]};const $=id=>document.getElementById(id);function save(){localStorage.seaham1=JSON.stringify(s)}function render(){$("energy").textContent=s.e;$("fill").style.width=s.e+"%";$("coins").textContent=s.c;$("count").textContent=Math.min(5,s.n)}function toast(t){let x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1700)}function spend(n){if(s.e<n){toast("⚡ Too tired — rest on the beach.");return false}s.e-=n;return true}
document.querySelectorAll(".glass").forEach(x=>x.onclick=()=>{if(x.dataset.done||!spend(1))return;x.dataset.done=1;x.style.display="none";s.n++;s.c+=+x.dataset.v;s.items.push(x.dataset.n);toast("💎 "+x.dataset.n+" sea glass found!");save();render()});
$("search").onclick=()=>{if(spend(3)){toast("🔎 You scan the pebbles.");save();render()}};$("waves").onclick=()=>{if(spend(8)){toast("🌊 You wade into the surf!");save();render()}};$("bag").onclick=()=>toast("🎒 "+s.items.length+" pieces collected");function start(){$("tutorial").style.display="none";toast("👩 Lisa: Good luck, pet!")}
let x=43,y=55;function move(dx,dy){x=Math.max(8,Math.min(82,x+dx));y=Math.max(45,Math.min(79,y+dy));document.querySelector(".player").style.left=x+"%";document.querySelector(".player").style.top=y+"%"}let drag=false,lx,ly;$("joy").ontouchstart=e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY};$("joy").ontouchmove=e=>{if(!drag)return;let t=e.touches[0];move((t.clientX-lx)/35,(t.clientY-ly)/35);lx=t.clientX;ly=t.clientY};$("joy").ontouchend=()=>drag=false;setInterval(()=>{if($("tutorial").style.display==="none"&&Math.random()<.12){toast("🌊 BIG WAVE! -15 energy");s.e=Math.max(0,s.e-15);save();render()}},3000);render();
</script></body></html>
